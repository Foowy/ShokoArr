name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick chaos if online, else GitHub-hosted
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          runner='["ubuntu-latest"]'
          if [[ "$HEAD_REPO" == "$REPO" ]]; then
            online=$(gh api "repos/$REPO/actions/runners" --jq '[.runners[] | select(.status == "online" and any(.labels[]; .name == "chaos"))] | length' 2>/dev/null || echo 0)
            if [[ "$online" -gt 0 ]]; then
              runner='["self-hosted","chaos"]'
            fi
          fi
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build & Test
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
